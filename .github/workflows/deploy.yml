name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_submodules:
        description: >-
          Build each project's latest documentation instead of the commit
          pinned here. A project repository dispatches this after publishing.
        type: boolean
        default: true

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      # A dispatch means a project just published docs the pinned commit does
      # not contain, so the checkout is moved forward before building. The
      # pointer is not committed: a push builds exactly what is pinned, and
      # only an explicit dispatch floats.
      - name: Pull each project's latest documentation
        if: inputs.refresh_submodules
        run: git submodule update --remote --recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install orchestrator dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test tests

      - name: Build all project docs
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=docs-itzemoji-com
